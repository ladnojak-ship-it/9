name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mc-mod:
    name: Minecraft mod (Fabric, JDK 25)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Build the Fabric mod
        run: |
          cd mc
          chmod +x gradlew
          ./gradlew build --no-daemon --console=plain
        env:
          GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx3g

      - name: Fetch the Minecraft-side mods (Fabric API, optional Sodium)
        run: python3 scripts/fetch_mc_mods.py

      - uses: actions/upload-artifact@v4
        with:
          name: mc-mod
          if-no-files-found: error
          path: |
            mc/build/libs/passthrough-*.jar
            fabric-api.jar
            optional/*.jar

  gta:
    name: GTA V plugin (MSVC) + package
    runs-on: windows-latest
    needs: mc-mod
    steps:
      - uses: actions/checkout@v4

      - name: Fetch build dependencies (ScriptHookV SDK, ReShade)
        shell: bash
        run: gta/fetch_deps.sh

      - name: Build MCPassthrough.asi (ScriptHookV script + ReShade add-on)
        shell: cmd
        run: gta\build.bat

      - name: Download the Minecraft mod artifact
        uses: actions/download-artifact@v4
        with:
          name: mc-mod
          path: artifacts/mc-mod

      - name: Stage install package and zip it
        shell: pwsh
        run: scripts/package.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: MinecraftInGTA
          if-no-files-found: error
          path: |
            dist/MinecraftInGTA.zip
            dist/stage/**
